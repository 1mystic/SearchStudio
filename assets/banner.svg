<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Search Studio: watch search algorithms think, one step at a time">
  <style>
    .t{font-family:"STIX Two Text",Georgia,"Times New Roman",serif;fill:#edebe6}
    .m{font-family:"JetBrains Mono",Consolas,monospace}
    .e{stroke:#5a5853;stroke-width:2.2}
    .p{stroke:#7fcb6a;stroke-width:5;stroke-linecap:round;fill:none;stroke-dasharray:640;stroke-dashoffset:640;animation:draw 7s ease-in-out infinite}
    .n{fill:#3a3d43;stroke:#d6d6d6;stroke-width:2.5}
    .nl{font-family:Georgia,serif;font-size:19px;font-weight:700;fill:#edebe6;text-anchor:middle}
    .pulse{fill:none;stroke:#f2cd4b;stroke-width:4;opacity:0;animation:pulse 7s infinite}
    .b{font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;fill:#f2cd4b;font-weight:600}
    @keyframes draw{0%,8%{stroke-dashoffset:640}55%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:640}}
    @keyframes pulse{0%{opacity:0}4%{opacity:1}14%{opacity:0}100%{opacity:0}}
    .d1{animation-delay:0s}.d2{animation-delay:1.1s}.d3{animation-delay:2.2s}.d4{animation-delay:3.3s}
    .cap{animation:cap 7s infinite;opacity:0}
    @keyframes cap{0%,4%{opacity:0}10%,90%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.p{animation:none;stroke-dashoffset:0}.pulse,.cap{animation:none;opacity:1}}
  </style>
  <rect width="1200" height="380" fill="#121212"/>
  <rect x="0.5" y="0.5" width="1199" height="379" fill="none" stroke="#34332f"/>
  <g transform="translate(64 92)">
    <text class="m" x="0" y="0" font-size="14" fill="#f2cd4b" letter-spacing="2">AI · SEARCH METHODS FOR PROBLEM SOLVING</text>
    <text class="t" x="0" y="70" font-size="64"><tspan fill="#f2cd4b" font-weight="600">Search</tspan> Studio</text>
    <line x1="0" y1="90" x2="350" y2="90" stroke="#a8a49b"/>
    <text class="t" x="0" y="136" font-size="27">Watch search algorithms <tspan fill="#f2cd4b" font-style="italic">think</tspan>,</text>
    <text class="t" x="0" y="172" font-size="27">one step at a time.</text>
    <text class="m" x="0" y="226" font-size="14" fill="#a8a49b">BFS · DFS · A* · SA · GA · ACO · α-β · SSS* · AO* · Waltz</text>
  </g>
  <g transform="translate(700 40)">
    <rect x="0" y="0" width="450" height="300" rx="10" fill="#181818" stroke="#34332f"/>
    <text class="t" x="225" y="34" font-size="19" text-anchor="middle">Dry run on G1</text>
    <line x1="160" y1="42" x2="290" y2="42" stroke="#a8a49b"/>
    <g class="e"><line x1="70" y1="110" x2="200" y2="80"/><line x1="70" y1="110" x2="120" y2="210"/><line x1="200" y1="80" x2="330" y2="100"/><line x1="200" y1="80" x2="240" y2="200"/><line x1="120" y1="210" x2="240" y2="200"/><line x1="330" y1="100" x2="390" y2="210"/><line x1="240" y1="200" x2="390" y2="210"/></g>
    <polyline class="p" points="70,110 200,80 240,200 390,210"/>
    <g>
      <circle class="n" cx="70" cy="110" r="20"/><circle class="pulse d1" cx="70" cy="110" r="25"/><text class="nl" x="70" y="117">S</text><text class="b" x="88" y="92">0</text>
      <circle class="n" cx="200" cy="80" r="20"/><circle class="pulse d2" cx="200" cy="80" r="25"/><text class="nl" x="200" y="87">A</text><text class="b" x="218" y="62">1</text>
      <circle class="n" cx="120" cy="210" r="20"/><text class="nl" x="120" y="217">B</text><text class="b" x="138" y="192">1</text>
      <circle class="n" cx="330" cy="100" r="20"/><text class="nl" x="330" y="107">C</text><text class="b" x="348" y="82">2</text>
      <circle class="n" cx="240" cy="200" r="20"/><circle class="pulse d3" cx="240" cy="200" r="25"/><text class="nl" x="240" y="207">D</text><text class="b" x="258" y="182">2</text>
      <circle class="n" cx="390" cy="210" r="20" style="fill:#22381c;stroke:#7fcb6a;stroke-width:3"/><circle class="pulse d4" cx="390" cy="210" r="25"/><text class="nl" x="390" y="217">G</text><text class="b" x="408" y="192">3</text>
    </g>
    <text class="m cap" x="24" y="262" font-size="13" fill="#f0a23b">OPEN   (C,A,2) (G,D,3)</text>
    <text class="m cap" x="24" y="284" font-size="13" fill="#a8a49b">CLOSED (D,A,2) (B,S,1) (A,S,1) (S,nil,0)</text>
  </g>
</svg>
